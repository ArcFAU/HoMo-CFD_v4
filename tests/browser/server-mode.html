<!doctype html><html><head><meta charset="utf-8"><title>server mode</title><script src="/test/harness.js"></script></head><body>
<script>
// The normal setup: serve.py with a working directory. Results load without
// a picker; viewers, pressure plots, 3D viewer and Stage 5 columns work.
const headerCells = (doc) => [...doc.querySelectorAll(".data-table thead th")].map((th) => th.textContent);
const dynamicPressure = (kmh, density = 1.18415) => 0.5 * density * (kmh / 3.6) ** 2;
const cellFor = (doc, rowName, header) => {
  const index = headerCells(doc).indexOf(header);
  const row = [...doc.querySelectorAll(".data-table tbody tr")].find((tr) => tr.cells[0].textContent === rowName);
  return row?.cells[index]?.textContent;
};

runTests(async () => {
  const app = frame("/", { captureOpen: true });
  await waitFor(() => app.contentDocument?.querySelector(".data-table tbody tr"), 60000);
  const doc = app.contentDocument;
  check("results load without folder picker", rowNames(doc).join(",") === "caseA,caseB", rowNames(doc).join(",") || doc.getElementById("error").textContent);
  check("tree root is the finished folder", doc.querySelector(".tree-root")?.textContent.startsWith("finished"), doc.querySelector(".tree-root")?.textContent);
  check("no error or reconnect shown", doc.getElementById("error").hidden && doc.getElementById("reconnect-results").hidden, doc.getElementById("error").textContent);

  // Stage 5: Downforce [N] and Drag [N] right after Iteration; raw monitors unchanged.
  const headers = headerCells(doc);
  check("force columns follow Iteration, no sign-flipped columns", headers.slice(1, 4).join("|") === "Iteration|Downforce [N]|Drag [N]" &&
    !headers.some((header) => header.startsWith("−")), headers.slice(0, 5).join("|"));
  check("L/D follows the forces, no balance column", headers.slice(4, 6).join("|") === "L/D|CzA Front(%)" && !headers.some((header) => /balance/i.test(header)), headers.slice(4, 6).join("|"));
  check("L/D = CzA / CxA", cellFor(doc, "caseA", "L/D") === "2.56" && cellFor(doc, "caseB", "L/D") === "2.50", `${cellFor(doc, "caseA", "L/D")} / ${cellFor(doc, "caseB", "L/D")}`);
  check("L/D explained on hover", /CzA ÷ CxA/.test([...doc.querySelectorAll(".data-table th")].find((th) => th.textContent === "L/D")?.title ?? ""));
  check("raw CzA / CxA unchanged", cellFor(doc, "caseA", "CzA") === "-3.200" && cellFor(doc, "caseB", "CxA") === "-1.400",
    `CzA ${cellFor(doc, "caseA", "CzA")}, CxA ${cellFor(doc, "caseB", "CxA")}`);
  check("CzA Front stays a fraction", cellFor(doc, "caseA", "CzA Front(%)") === "0.450", cellFor(doc, "caseA", "CzA Front(%)"));
  check("computed columns explained on hover", /CzA is the downforce coefficient × reference area/.test(doc.querySelector(".data-table th.derived-column")?.title ?? ""), doc.querySelector(".data-table th.derived-column")?.title);
  check("monitor chart defaults to Downforce [N]", doc.querySelector(".monitor-chart-controls select")?.value === "Downforce [N]", doc.querySelector(".monitor-chart-controls select")?.value);
  [...doc.querySelectorAll(".table-mode-switch button")].find((button) => button.textContent === "Δ vs reference").click();
  await waitFor(() => headerCells(doc).includes("Δ Downforce [N]"));
  check("Δ Downforce [N] positive = more downforce", cellFor(doc, "caseB", "Δ Downforce [N]") === (0.3 * dynamicPressure(60)).toFixed(1) && cellFor(doc, "caseA", "Δ Downforce [N]") === "0.0",
    `caseB ${cellFor(doc, "caseB", "Δ Downforce [N]")}, caseA ${cellFor(doc, "caseA", "Δ Downforce [N]")}`);
  check("Δ Drag [N] positive = more drag", cellFor(doc, "caseB", "Δ Drag [N]") === (0.15 * dynamicPressure(60)).toFixed(1), cellFor(doc, "caseB", "Δ Drag [N]"));
  check("Δ L/D", cellFor(doc, "caseB", "Δ L/D") === "-0.06", cellFor(doc, "caseB", "Δ L/D"));
  check("Δ CzA keeps the exported sign", cellFor(doc, "caseB", "Δ CzA") === "-0.300", cellFor(doc, "caseB", "Δ CzA"));
  check("Δ note is one short line", doc.querySelector(".comparison-note")?.textContent === "Δ = simulation − reference", doc.querySelector(".comparison-note")?.textContent);
  check("no explanation under the monitor chart title", !doc.querySelector(".monitor-chart-note"));
  [...doc.querySelectorAll(".table-mode-switch button")].find((button) => button.textContent === "Values").click();
  await waitFor(() => headerCells(doc).includes("Downforce [N]"));

  // Residuals, CzA and CxA from the solver logs (fixture: 30 iterations; caseB's residuals twice caseA's, CzA 0.1 lower).
  const residualsEntry = doc.querySelector('.residuals-entry[data-path="caseA#residuals"]');
  check("Residuals entry for each case with a job log", residualsEntry && doc.querySelectorAll(".residuals-entry").length === 2);
  residualsEntry.click();
  await waitFor(() => doc.querySelector(".residual-chart") || doc.querySelector("#panels .error"), 10000);
  const residualCards = () => [...doc.querySelectorAll(".residual-card")];
  const residualLines = [...residualCards()[0].querySelectorAll(".residual-line")];
  check("CzA and CxA charts under the residuals", residualCards().map((card) => card.querySelector("h2").textContent).slice(1).join("|") === "CzA (total)|CxA (total)" &&
    residualCards()[1].querySelectorAll(".residual-line").length === 1, residualCards().map((card) => card.querySelector("h2").textContent).join("|"));
  check("residual chart: one line per equation, turbulence dashed", residualLines.length === 6 &&
    residualLines.map((line) => line.getAttribute("stroke-dasharray") ? "-" : "|").join("") === "||||--" &&
    doc.querySelector(".workspace-title")?.textContent === "caseA · residuals" && /iterations 1–30/.test(doc.querySelector(".residual-card h2")?.textContent ?? ""),
    `${residualLines.length} ${doc.querySelector(".residual-card h2")?.textContent}`);
  check("residual legend: names and last residuals", [...doc.querySelectorAll(".residual-legend li")].map((li) => li.textContent).join("|") ===
    ["Continuity", "X-momentum", "Y-momentum", "Z-momentum", "Tke", "Sdr"].map((name, column) => `${name} ${(10 ** (-3 - column / 2)).toExponential(2)}`).join("|"),
    [...doc.querySelectorAll(".residual-legend li")].map((li) => li.textContent).join("|"));
  const residualSvg = doc.querySelector(".residual-chart"), residualBox = residualSvg.getBoundingClientRect();
  residualSvg.dispatchEvent(new PointerEvent("pointermove", { clientX: residualBox.left + residualBox.width / 2, clientY: residualBox.top + 50, bubbles: true }));
  const residualTip = doc.querySelector(".residual-tooltip");
  check("hovering the residual chart shows every residual at that iteration", !residualTip.hidden && /^Iteration 1[56]/.test(residualTip.textContent) &&
    residualTip.querySelectorAll("div").length === 6, residualTip.textContent);
  // Compare: one equation at a time, one line per case; CzA and CxA per case.
  const compareSelect = doc.querySelector(".residual-toolbar select");
  compareSelect.value = "caseB"; compareSelect.dispatchEvent(new Event("change"));
  await waitFor(() => doc.querySelectorAll(".residual-case-chip").length === 2 && residualCards().length === 3, 10000);
  check("comparing two cases: a line per case in each chart", residualCards().map((card) => card.querySelector("h2").textContent).join("|") === "Continuity residual|CzA (total)|CxA (total)" &&
    residualCards().every((card) => card.querySelectorAll(".residual-line").length === 2) && doc.querySelector(".workspace-title")?.textContent === "Residuals",
    residualCards().map((card) => card.querySelector("h2").textContent).join("|"));
  const equationSelect = doc.querySelectorAll(".residual-toolbar select")[1];
  equationSelect.value = "Sdr"; equationSelect.dispatchEvent(new Event("change"));
  await waitFor(() => residualCards()[0]?.querySelector("h2").textContent === "Sdr residual", 10000);
  const czaSvg = residualCards()[1].querySelector(".residual-chart"), czaBox = czaSvg.getBoundingClientRect();
  czaSvg.dispatchEvent(new PointerEvent("pointermove", { clientX: czaBox.left + czaBox.width / 2, clientY: czaBox.top + 50, bubbles: true }));
  const czaTip = residualCards()[1].querySelector(".residual-tooltip");
  const iterationAt = Number(czaTip.textContent.match(/^Iteration (\d+)/)?.[1]);
  check("CzA hover lists each case's value", !czaTip.hidden && czaTip.textContent.includes(`caseA ${(-3 - iterationAt / 100).toFixed(3)}`) &&
    czaTip.textContent.includes(`caseB ${(-3.1 - iterationAt / 100).toFixed(3)}`), czaTip.textContent);
  [...doc.querySelectorAll(".residual-case-chip")].find((chip) => chip.textContent.startsWith("caseB")).querySelector("button").click();
  await waitFor(() => doc.querySelector(".workspace-title")?.textContent === "caseA · residuals" && residualCards()[0]?.querySelectorAll(".residual-line").length === 6, 10000);
  check("removing the second case shows one case again", !doc.querySelector(".residual-case-chip"));
  doc.querySelector(".summary .small-control").click();
  await waitFor(() => doc.querySelector(".data-table tbody tr"), 10000);
  check("Back to coefficients", rowNames(doc).join(",") === "caseA", rowNames(doc).join(","));
  doc.querySelector(".tree-root").click();
  await waitFor(() => rowNames(doc).length === 2, 10000);

  // Highlighting rows: the star before the name; remembered, also after the table is drawn again.
  const tableRow = (name) => [...doc.querySelectorAll(".data-table tbody tr")].find((tr) => tr.cells[0].textContent === name);
  tableRow("caseB").querySelector(".row-highlight").click();
  check("the star highlights its row, the name stays the cell's text", tableRow("caseB")?.classList.contains("highlighted-row") &&
    !tableRow("caseA")?.classList.contains("highlighted-row") && tableRow("caseB").querySelector(".row-highlight").getAttribute("aria-pressed") === "true");
  [...doc.querySelectorAll(".table-mode-switch button")].find((button) => button.textContent === "Δ vs reference").click();
  await waitFor(() => headerCells(doc).includes("Δ Downforce [N]"));
  check("a highlighted row stays highlighted (Δ view, remembered)", tableRow("caseB")?.classList.contains("highlighted-row") &&
    JSON.parse(app.contentWindow.localStorage.getItem("homo-cfd-highlighted-simulations-v1")).length === 1);
  [...doc.querySelectorAll(".table-mode-switch button")].find((button) => button.textContent === "Values").click();
  await waitFor(() => headerCells(doc).includes("Downforce [N]"));
  tableRow("caseB").querySelector(".row-highlight").click();
  check("clicking the star again removes the highlight", !tableRow("caseB")?.classList.contains("highlighted-row") &&
    app.contentWindow.localStorage.getItem("homo-cfd-highlighted-simulations-v1") === "[]");

  // Customize columns: drag a row by its grip (or ↑/↓ on the grip) to reorder the columns.
  doc.querySelector(".customize-columns").click();
  const editorKeys = () => [...doc.querySelectorAll("#column-editor .column-config-row")].map((row) => row.querySelector("input[type=text]").value);
  const before = editorKeys();
  check("column rows have a drag grip, no arrow buttons", doc.querySelectorAll("#column-editor .column-drag-handle").length === before.length && !doc.querySelector("#column-editor .column-move"));
  // Like a real drag: after the first step the row has moved, so the pointer events go to whatever is
  // under the pointer, not to the grip.
  const grip = doc.querySelector("#column-editor .column-drag-handle");
  const gripX = grip.getBoundingClientRect().left + 5;
  const rowBottom = (index) => doc.querySelectorAll("#column-editor .column-config-row")[index].getBoundingClientRect().bottom - 2;
  const pointer = (type, y, target = doc.elementFromPoint(gripX, y) ?? doc.body) =>
    target.dispatchEvent(new PointerEvent(type, { bubbles: true, button: 0, pointerId: 7, clientX: gripX, clientY: y }));
  pointer("pointerdown", grip.getBoundingClientRect().top + 5, grip);
  for (const index of [1, 2, 3]) pointer("pointermove", rowBottom(index));
  pointer("pointerup", rowBottom(3));
  const dragged = editorKeys();
  check("dragging the first column down three places", dragged.slice(0, 4).join("|") === [before[1], before[2], before[3], before[0]].join("|"), dragged.slice(0, 5).join("|"));
  doc.querySelectorAll("#column-editor .column-drag-handle")[3].dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowUp", bubbles: true }));
  check("↑ on the grip moves it back up one place", editorKeys().slice(0, 4).join("|") === [before[1], before[2], before[0], before[3]].join("|") &&
    doc.activeElement === doc.querySelectorAll("#column-editor .column-drag-handle")[2], editorKeys().slice(0, 4).join("|"));
  doc.getElementById("column-save").click();
  check("the table follows the new order", headerCells(doc).slice(1, 5).join("|") === [before[1], before[2], before[0], before[3]].join("|"), headerCells(doc).slice(0, 5).join("|"));
  doc.querySelector(".customize-columns").click();
  doc.getElementById("column-reset").click();
  await waitFor(() => headerCells(doc).slice(1, 4).join("|") === before.slice(0, 3).join("|"), 5000);

  // Forces: F = ½ · ρ · v² · (−CzA), default 60 km/h and ρ = 1.18415 kg/m³.
  check("Downforce [N] at 60 km/h", cellFor(doc, "caseA", "Downforce [N]") === (3.2 * dynamicPressure(60)).toFixed(1), cellFor(doc, "caseA", "Downforce [N]"));
  check("Drag [N] at 60 km/h", cellFor(doc, "caseB", "Drag [N]") === (1.4 * dynamicPressure(60)).toFixed(1), cellFor(doc, "caseB", "Drag [N]"));
  check("force note shows speed, density and q", /v = 60 km\/h.*ρ = 1\.18415 kg\/m³.*164\.5 Pa/.test([...doc.querySelectorAll(".data-table th.derived-column")].find((th) => th.textContent === "Downforce [N]")?.title ?? ""),
    [...doc.querySelectorAll(".data-table th.derived-column")].find((th) => th.textContent === "Downforce [N]")?.title);
  const speed = doc.querySelector('input[data-force-setting="speedKmh"]');
  speed.value = "100";
  speed.dispatchEvent(new app.contentWindow.Event("change"));
  await waitFor(() => cellFor(doc, "caseA", "Downforce [N]") === (3.2 * dynamicPressure(100)).toFixed(1), 5000);
  check("changing the speed recomputes the forces", cellFor(doc, "caseA", "Downforce [N]") === (3.2 * dynamicPressure(100)).toFixed(1) && cellFor(doc, "caseA", "CzA") === "-3.200",
    cellFor(doc, "caseA", "Downforce [N]"));
  check("speed is remembered", JSON.parse(app.contentWindow.localStorage.getItem("homo-cfd-force-settings-v1") || "{}").speedKmh === 100);
  speed.value = "-5";
  speed.dispatchEvent(new app.contentWindow.Event("change"));
  check("invalid speed is rejected", !speed.validity.valid && cellFor(doc, "caseA", "Downforce [N]") === (3.2 * dynamicPressure(100)).toFixed(1), cellFor(doc, "caseA", "Downforce [N]"));
  speed.value = "60";
  speed.dispatchEvent(new app.contentWindow.Event("change"));

  // Sorting rows: a header click sorts ascending, again descending, a third time back to the original order.
  const sortBy = (label) => [...doc.querySelectorAll(".data-table thead .sort-button")].find((button) => button.textContent === label).click();
  const sortState = () => [...doc.querySelectorAll(".data-table thead th")].filter((th) => th.getAttribute("aria-sort") !== "none")
    .map((th) => `${th.textContent}:${th.getAttribute("aria-sort")}`).join(",");
  sortBy("Simulation");
  check("a header click sorts ascending", rowNames(doc).join(",") === "caseA,caseB" && sortState() === "Simulation:ascending", `${rowNames(doc)} ${sortState()}`);
  sortBy("Simulation");
  check("a second click sorts descending, header text unchanged", rowNames(doc).join(",") === "caseB,caseA" && sortState() === "Simulation:descending" &&
    headerCells(doc)[0] === "Simulation", `${rowNames(doc)} ${sortState()} ${headerCells(doc)[0]}`);
  [...doc.querySelectorAll(".table-mode-switch button")].find((button) => button.textContent === "Δ vs reference").click();
  await waitFor(() => headerCells(doc).includes("Δ Downforce [N]"));
  check("the sort stays when the view changes", rowNames(doc).join(",") === "caseB,caseA", rowNames(doc).join(","));
  sortBy("Δ Downforce [N]");
  check("Δ view sorts by the difference", rowNames(doc).join(",") === "caseA,caseB" && sortState() === "Δ Downforce [N]:ascending", `${rowNames(doc)} ${sortState()}`);
  sortBy("Δ Downforce [N]");
  [...doc.querySelectorAll(".table-mode-switch button")].find((button) => button.textContent === "Values").click();
  await waitFor(() => headerCells(doc).includes("Downforce [N]"));
  check("the sort is remembered", rowNames(doc).join(",") === "caseB,caseA" && sortState() === "Downforce [N]:descending" &&
    JSON.parse(app.contentWindow.localStorage.getItem("homo-cfd-coefficient-table-sort-v1") || "{}").direction === "desc", `${rowNames(doc)} ${sortState()}`);
  const sorted = app.contentWindow.eval(`(() => { const row = (name, value) => ({ path: name + "/plots/Coefficients_49.csv", headers: ["K"], rows: [[value]] });
    const rows = [row("a", "2"), row("b", ""), row("c", "1")], names = (sort) => sortCoefficientRows(rows, sort).map((data) => data.path[0]).join("");
    return names({ key: "K", direction: "asc" }) + " " + names({ key: "K", direction: "desc" }); })()`);
  check("empty cells sort last both ways", sorted === "cab acb", sorted);
  sortBy("Downforce [N]");
  check("a third click restores the original order", rowNames(doc).join(",") === "caseA,caseB" && sortState() === "" &&
    app.contentWindow.localStorage.getItem("homo-cfd-coefficient-table-sort-v1") === null, `${rowNames(doc)} ${sortState()}`);
  await waitFor(() => cellFor(doc, "caseA", "Downforce [N]") === (3.2 * dynamicPressure(60)).toFixed(1), 5000);

  // Comparison window: 1 → 4 panels, minimum readable panel height, zoom keys.
  doc.querySelector('.tree-entry.image-folder[data-path="caseA/Cp_x-Section"]').click();
  await waitFor(() => opened[0]?.contentDocument?.querySelector(".compare-image-panel img")?.naturalWidth, 30000);
  const win = opened[0].contentWindow, viewer = win.document;
  check("viewer opens with the server image", viewer.querySelector(".compare-image-panel img")?.naturalWidth > 0, viewer.getElementById("viewer-error").textContent);
  check("comparison window has no hint line under its title", viewer.getElementById("viewer-path").hidden && !viewer.getElementById("viewer-path").textContent,
    viewer.getElementById("viewer-path").textContent);
  const stage = viewer.getElementById("image-stage");
  const addCase = async (name) => {
    viewer.getElementById("add-case").click();
    const count = viewer.querySelectorAll(".compare-image-panel").length;
    const select = viewer.querySelectorAll(".compare-case-header select")[count - 1];
    select.value = name;
    select.dispatchEvent(new win.Event("change"));
    await waitFor(() => viewer.querySelectorAll(".compare-image-panel img").length === count, 30000);
    await idle(win);
  };
  await addCase("caseB");
  check("two cases side by side", stage.classList.contains("compare-count-2") && Math.abs(viewer.querySelectorAll(".compare-image-panel")[0].getBoundingClientRect().top - viewer.querySelectorAll(".compare-image-panel")[1].getBoundingClientRect().top) < 2, stage.className);
  for (let step = 0; step < 5; step++) { key(win, "ArrowRight"); await idle(win); }
  check("arrow keys step the focused case", captionIndex(viewer, 1) === 6, viewer.querySelectorAll(".compare-image-caption")[1]?.textContent);
  // Stepping must not flash: same panel, image swapped in already sized, zoomed position kept.
  const panelBefore = viewer.querySelectorAll(".compare-image-panel")[1];
  const stepStage = viewer.querySelectorAll(".compare-image-stage")[1];
  key(win, "+"); key(win, "+"); await idle(win);
  // Scroll only once the zoom has made the image larger than its panel (else the browser keeps 0,0).
  await waitFor(() => stepStage.scrollWidth > stepStage.clientWidth + 40 && stepStage.scrollHeight > stepStage.clientHeight + 30, 5000);
  stepStage.scrollLeft = 40; stepStage.scrollTop = 30;
  await waitFor(() => stepStage.scrollLeft === 40 && stepStage.scrollTop === 30, 2000);
  const panBefore = `${stepStage.scrollLeft},${stepStage.scrollTop}`;
  const imageBefore = stepStage.querySelector("img");
  const unsized = [];
  const watcher = new win.MutationObserver(() => {
    const shown = viewer.querySelectorAll(".compare-image-stage")[1]?.querySelector("img");
    if (shown && !shown.style.width) unsized.push(shown.alt);
  });
  watcher.observe(viewer.getElementById("image-stage"), { childList: true, subtree: true });
  key(win, "ArrowRight"); await idle(win);
  watcher.disconnect();
  check("stepping swaps the image inside the same panel", viewer.querySelectorAll(".compare-image-panel")[1] === panelBefore &&
    stepStage.isConnected && stepStage.querySelector("img") !== imageBefore && captionIndex(viewer, 1) === 7, String(captionIndex(viewer, 1)));
  check("the next image is sized before it is shown", unsized.length === 0 && stepStage.querySelector("img")?.style.width !== "", unsized.join(", "));
  check("stepping keeps the zoomed position", stepStage.scrollLeft > 0 && `${stepStage.scrollLeft},${stepStage.scrollTop}` === panBefore,
    `${panBefore} → ${stepStage.scrollLeft},${stepStage.scrollTop}`);
  key(win, "0"); await idle(win);
  await addCase("caseA");
  await addCase("caseB");
  const heights = [...viewer.querySelectorAll(".compare-image-panel")].map((panel) => Math.round(panel.getBoundingClientRect().height));
  check("four cases keep a readable height (≥ 420 px) and scroll", stage.classList.contains("compare-count-4") && heights.every((height) => height >= 419) && stage.scrollHeight > stage.clientHeight,
    `${stage.className}; heights ${heights}; scroll ${stage.scrollHeight}/${stage.clientHeight}`);
  key(win, "+");
  check("+ zooms in", viewer.getElementById("zoom-level").textContent === "120%", viewer.getElementById("zoom-level").textContent);
  key(win, "-"); key(win, "-");
  check("- zooms out", viewer.getElementById("zoom-level").textContent === "83%", viewer.getElementById("zoom-level").textContent);
  key(win, "0");
  check("0 resets zoom", viewer.getElementById("zoom-level").textContent === "100%", viewer.getElementById("zoom-level").textContent);
  const panelStage = viewer.querySelector(".compare-image-stage");
  const barWidth = (element) => {
    const style = win.getComputedStyle(element);
    return element.offsetWidth - element.clientWidth - parseFloat(style.borderLeftWidth) - parseFloat(style.borderRightWidth);
  };
  check("no scroll bars in the image viewer", win.getComputedStyle(stage).scrollbarWidth === "none" && barWidth(stage) === 0 && barWidth(panelStage) === 0,
    `${win.getComputedStyle(stage).scrollbarWidth} window ${barWidth(stage)} px, panel ${barWidth(panelStage)} px`);
  stage.scrollTop = 200;
  check("3-4 case layout is still scrollable without the bar", stage.scrollTop > 0, String(stage.scrollTop));
  stage.scrollTop = 0;

  // Pressure plot, scene gallery, 3D viewer from the tree.
  doc.querySelector('summary.tree-entry[data-path="caseA/PressureDistributions/pd_FW_x-Section"]').click();
  await waitFor(() => doc.querySelector("svg.pressure-chart"), 30000);
  check("pressure plot renders", /2460 mm/.test(doc.querySelector(".pressure-chart-title")?.textContent ?? "") && /40 measurements/.test(doc.querySelector(".pressure-chart-details")?.textContent ?? ""),
    `${doc.querySelector(".pressure-chart-title")?.textContent} | ${doc.querySelector(".pressure-chart-details")?.textContent}`);
  check("pressure toolbar shows only the station", doc.querySelector(".pressure-measurement")?.textContent === "2460 mm", doc.querySelector(".pressure-measurement")?.textContent);
  doc.querySelector('.scene-gallery-folder[data-path="caseA/3D"]').click();
  await waitFor(() => opened[1]?.contentDocument?.querySelector("#image-stage img")?.naturalWidth, 30000);
  check("scene gallery loads", opened[1]?.contentDocument?.querySelector("#image-stage img")?.naturalWidth > 0);
  const ensight = doc.querySelector('.ensight-folder[data-path="caseA/3D-data"]');
  check("3D-data has a 3D viewer entry", ensight, [...doc.querySelectorAll(".ensight-folder")].map((entry) => entry.dataset.path).join(","));
  ensight?.click();
  await waitFor(() => opened[2]?.contentDocument?.getElementById("legend")?.hidden === false ||
    opened[2]?.contentDocument?.getElementById("error")?.hidden === false, 60000);
  const viewer3d = opened[2]?.contentDocument, parts = () => opened[2]?.contentWindow?.eval("geometryParts.filter((p) => p.points.length).map((p) => p.name).join(',')");
  check("3D viewer loads the EnSight case from the tree", viewer3d?.getElementById("legend")?.hidden === false && parts() === "Frontwing,Lambda2,Streamlines 1,Streamlines 2" &&
    opened[2].contentWindow.eval("model.ix.length / 3") === 5,
    viewer3d?.getElementById("error")?.hidden === false ? viewer3d.getElementById("error").textContent : parts());
  check("3D viewer names the simulation in the window title, no parts line", viewer3d.title === "caseA · 3D viewer — HoMo CFD" && !viewer3d.getElementById("case-name"), viewer3d.title);
  // The case's coefficients next to the car (caseA: CzA -3.2, CxA -1.25; forces at the table's 60 km/h).
  await waitFor(() => viewer3d.getElementById("coefficients")?.hidden === false, 10000);
  const coefficientText = viewer3d.getElementById("coefficients")?.textContent ?? "";
  check("3D viewer shows the case's coefficients", /caseA/.test(coefficientText) && /CzA−3\.200/.test(coefficientText) && /CxA−1\.250/.test(coefficientText) &&
    /L\/D2\.56/.test(coefficientText) && coefficientText.includes(`Downforce${(3.2 * dynamicPressure(60)).toFixed(1)} N`) && /FW−1\.100−0\.300/.test(coefficientText) && /60 km\/h/.test(coefficientText), coefficientText);
  // The Simulation list: every 3D-data folder of the results folder (only caseA has one), the open one selected.
  await waitFor(() => viewer3d.getElementById("case-select")?.options.length > 1, 10000);
  const viewerCases = [...viewer3d.getElementById("case-select").options].map((option) => `${option.textContent}=${option.value}`);
  check("3D viewer lists the simulations with 3D data, the open one selected", viewerCases.slice(1).join(",") === "caseA=caseA/3D-data" &&
    viewer3d.getElementById("case-select").value === "caseA/3D-data" && viewer3d.getElementById("open-folder").hidden, viewerCases.join(","));
  // The sidebar's 3D viewer button: an empty viewer with the list; choosing a simulation opens it.
  doc.getElementById("open-3d-viewer").click();
  await waitFor(() => opened[3]?.contentDocument?.getElementById("case-select")?.options.length > 1, 15000);
  const emptyViewer = opened[3].contentDocument;
  check("3D viewer button: choose a simulation from the list", /Choose a simulation/.test(emptyViewer.getElementById("message").textContent) &&
    !emptyViewer.getElementById("case-control").hidden, emptyViewer.getElementById("message").textContent);
  emptyViewer.getElementById("case-select").value = "caseA/3D-data";
  emptyViewer.getElementById("case-select").dispatchEvent(new Event("change"));
  await waitFor(() => emptyViewer.getElementById("legend")?.hidden === false || emptyViewer.getElementById("error")?.hidden === false, 30000);
  check("choosing a simulation loads its 3D data", emptyViewer.getElementById("legend").hidden === false && opened[3].contentWindow.eval("model.ix.length / 3") === 5 &&
    emptyViewer.title === "caseA · 3D viewer — HoMo CFD", emptyViewer.getElementById("error").textContent);

  // Stage 7 step 1: Fritz cluster settings (fake WinSCP on the test server).
  const clusterButton = doc.getElementById("cluster-settings");
  check("Fritz cluster button shown with serve.py", clusterButton && !clusterButton.hidden);
  clusterButton.click();
  await waitFor(() => doc.getElementById("cluster-session"), 10000);
  const sessionSelect = doc.getElementById("cluster-session");
  check("WinSCP sessions are offered", [...sessionSelect.options].map((option) => option.value).join(",") === ",Fritz,Other",
    [...sessionSelect.options].map((option) => option.value).join(","));
  sessionSelect.value = "Fritz";
  doc.getElementById("cluster-folder").value = "/home/vault/g/u/Pipeline";
  doc.getElementById("cluster-test").click();
  await waitFor(() => /Connected/.test(doc.querySelector(".cluster-status")?.textContent ?? ""), 10000);
  check("Test connection reports the remote folder", doc.querySelector(".cluster-status")?.textContent === "Connected. Remote folder: /home/vault/g/u/Pipeline",
    doc.querySelector(".cluster-status")?.textContent);
  doc.getElementById("cluster-folder").value = "Pipeline";
  doc.getElementById("cluster-save").click();
  await waitFor(() => doc.querySelector(".cluster-status.error"), 10000);
  check("relative remote folder is refused", /must be a path/.test(doc.querySelector(".cluster-status")?.textContent ?? ""), doc.querySelector(".cluster-status")?.textContent);
  doc.getElementById("cluster-folder").value = "/home/vault/g/u/Pipeline";
  doc.getElementById("cluster-save").click();
  await waitFor(() => doc.querySelector(".cluster-status")?.textContent === "Saved.", 10000);
  check("Pageant status shown", /Pageant is not running/.test(doc.getElementById("pageant-status")?.textContent ?? ""), doc.getElementById("pageant-status")?.textContent);
  doc.getElementById("cluster-unlock").click();
  await waitFor(() => /asking for your key/.test(doc.querySelector(".cluster-status")?.textContent ?? ""), 10000);
  check("Unlock key with Pageant hands the key to Pageant", /Pageant is running/.test(doc.getElementById("pageant-status")?.textContent ?? "") &&
    (await (await fetch("/api/cluster")).json()).pageant.running, doc.querySelector(".cluster-status")?.textContent);
  const savedCluster = await (await fetch("/api/cluster")).json();
  check("cluster settings are saved", savedCluster.session === "Fritz" && savedCluster.remoteFolder === "/home/vault/g/u/Pipeline", JSON.stringify(savedCluster));

  // Stage 7 step 2: simulations on Fritz (fake status output) and a download.
  await waitFor(() => doc.querySelector('.cluster-table tr[data-case="caseC"]'), 10000);
  const clusterRow = (name) => doc.querySelector(`.cluster-table tr[data-case="${name}"]`);
  check("cases listed with their state", clusterRow("caseC")?.cells[1].textContent === "Ready to download" && clusterRow("caseD")?.cells[1].textContent === "Solving",
    [...doc.querySelectorAll(".cluster-table tbody tr")].map((row) => `${row.cells[0].textContent}:${row.cells[1].textContent}`).join(", "));
  // Results on Fritz: the last coefficient row per case, with the results table's columns and speed.
  const resultRow = doc.querySelector('.cluster-results-table tr[data-case="caseC"]');
  const resultCells = [...(resultRow?.cells ?? [])].map((td) => td.textContent);
  const resultTitles = [...doc.querySelectorAll(".cluster-results-table thead th")].map((th) => th.textContent);
  check("Results on Fritz shows each case's last coefficients, forces and parts", !doc.querySelector(".cluster-results").hidden &&
    resultCells.slice(0, 9).join("|") === `caseC|1000|-5.000|-2.000|2.50|${(5 * dynamicPressure(60)).toFixed(1)}|${(2 * dynamicPressure(60)).toFixed(1)}|-1.800|-0.300` &&
    resultTitles.slice(7, 13).join(",") === "CzA FW,CxA FW,CzA UT,CxA UT,CzA RW,CxA RW" &&
    !doc.querySelector('.cluster-results-table tr[data-case="caseD"]'), `${resultTitles.join(",")} | ${resultCells.join("|")}`);
  check("case already in finished is marked", clusterRow("caseA")?.cells[3].textContent === "In finished" && !clusterRow("caseA")?.querySelector("button"),
    clusterRow("caseA")?.textContent);
  check("failed post-processing shown, still downloadable", /Post-processing failed/.test(clusterRow("caseG")?.cells[1].textContent ?? "") &&
    clusterRow("caseG")?.querySelector("button")?.textContent === "Download anyway" && !clusterRow("caseG")?.querySelector("button")?.disabled,
    clusterRow("caseG")?.textContent);
  check("long-silent case flagged as probably stopped", /probably stopped/.test(clusterRow("caseE")?.cells[1].textContent ?? "") &&
    clusterRow("caseE")?.querySelector("button")?.textContent === "Download anyway", clusterRow("caseE")?.textContent);
  check("running case cannot be downloaded yet", clusterRow("caseD")?.querySelector("button")?.disabled === true, clusterRow("caseD")?.textContent);
  clusterRow("caseC").querySelector("button").click();
  await waitFor(() => /Downloaded/.test(clusterRow("caseC")?.cells[4].textContent ?? ""), 15000);
  check("download completes and offers Reload results", /Downloaded/.test(clusterRow("caseC")?.cells[4].textContent ?? "") &&
    clusterRow("caseC")?.querySelector("button")?.textContent === "Reload results", clusterRow("caseC")?.textContent);
  const afterList = await (await fetch("/api/list?path=")).json();
  check("downloaded case is in finished", afterList.some((entry) => entry.name === "caseC"), afterList.map((entry) => entry.name).join(","));

  // Steps 3-4: job session, Start, new simulation (fake WinSCP; confirmations accepted).
  const confirmed = [];
  app.contentWindow.confirm = (message) => { confirmed.push(message); return true; };
  check("not-started case has no Start without a job session", !clusterRow("caseF")?.querySelector("button"), clusterRow("caseF")?.textContent);
  const submitSelect = doc.getElementById("cluster-submit-session");
  const submitNote = doc.getElementById("cluster-submit-note");
  check("job session suggests the fritz login node", !submitNote.hidden && /choose "Other"/.test(submitNote.textContent), submitNote.textContent);
  submitSelect.value = "Fritz";
  submitSelect.dispatchEvent(new app.contentWindow.Event("change"));
  check("jump host as job session is flagged", !submitNote.hidden && /csnhr, NHR's jump host, which cannot start jobs\. Choose "Other" instead/.test(submitNote.textContent),
    submitNote.textContent);
  submitSelect.value = "Other";
  submitSelect.dispatchEvent(new app.contentWindow.Event("change"));
  check("login node as job session has no warning", submitNote.hidden, submitNote.textContent);
  doc.getElementById("cluster-save").click();
  await waitFor(() => clusterRow("caseF")?.querySelector("button")?.textContent === "Start", 10000);
  check("running job shown from the queue", /Running 1:02:03 \(job 4100, resTAURANtS\)/.test(clusterRow("caseD")?.cells[1].textContent ?? ""),
    clusterRow("caseD")?.cells[1].textContent);
  clusterRow("caseF").querySelector("button").click();
  await waitFor(() => /caseF started: job 4242/.test(doc.querySelector(".cluster-cases .cluster-status")?.textContent ?? ""), 10000);
  check("Start asks first and reports the job", /Start caseF on Fritz\?/.test(confirmed[0] ?? "") &&
    /job 4242/.test(doc.querySelector(".cluster-cases .cluster-status")?.textContent ?? ""), doc.querySelector(".cluster-cases .cluster-status")?.textContent);
  await waitFor(() => /submitted \(job 4242\)/.test(clusterRow("caseF")?.cells[1].textContent ?? ""), 10000);
  check("started case cannot be started again", !clusterRow("caseF")?.querySelector("button") && /submitted \(job 4242\)/.test(clusterRow("caseF")?.cells[1].textContent ?? ""),
    clusterRow("caseF")?.textContent);

  doc.querySelector(".cluster-new-case").open = true;
  doc.getElementById("new-case-name").value = "new1";
  doc.getElementById("new-case-load").click();
  await waitFor(() => doc.querySelectorAll("#new-case-settings input[data-key]").length === 2, 10000);
  const velocity = doc.querySelector('#new-case-settings input[data-key="Vehicle State/Velocity"]');
  check("template Settings load into the form", velocity?.value === "40.0" && /Copy of caseC/.test(doc.getElementById("new-case-source").textContent),
    `${velocity?.value} | ${doc.getElementById("new-case-source").textContent}`);
  velocity.value = "60.0";
  velocity.dispatchEvent(new app.contentWindow.Event("input"));
  check("changed setting is highlighted", velocity.classList.contains("changed"));
  doc.getElementById("new-case-sim").value = new URLSearchParams(location.search).get("sim");
  doc.getElementById("new-case-create").click();
  await waitFor(() => /new1: Created on Fritz/.test(doc.querySelector(".cluster-new-case .cluster-status")?.textContent ?? ""), 15000);
  check("new simulation is created after confirming", /1 changed setting/.test(confirmed[1] ?? "") &&
    /Created on Fritz/.test(doc.querySelector(".cluster-new-case .cluster-status")?.textContent ?? ""),
    `${confirmed[1]} | ${doc.querySelector(".cluster-new-case .cluster-status")?.textContent}`);

  // Opening HoMo again: the saved listing of the results folder shows at once (no slow disk scan);
  // a case added on disk since then appears by itself once the background scan has finished.
  await fetch("/__fs/add-case");
  const again = frame("/");
  await waitFor(() => again.contentDocument?.querySelector(".data-table tbody tr"), 60000);
  const shownFirst = rowNames(again.contentDocument).join(",");
  await waitFor(() => rowNames(again.contentDocument).includes("caseZ"), 20000);
  // (Earlier checks download caseC into finished, so the fresh scan finds it too.)
  check("a new start shows the saved listing at once, then the case added since", shownFirst === "caseA,caseB" &&
    rowNames(again.contentDocument).join(",") === "caseA,caseB,caseC,caseZ", `${shownFirst} → ${rowNames(again.contentDocument).join(",")}`);
  await fetch("/__fs/remove-case");
});
</script></body></html>
