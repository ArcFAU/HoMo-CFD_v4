<!doctype html><html><head><meta charset="utf-8"><title>picker mode</title><script src="/test/mock.js"></script><script src="/test/harness.js"></script></head><body>
<script>
// Pages opened without serve.py choose a folder in the browser. The folder
// picker is mocked (mock.js) over virtual folder layouts of the fixture:
//   single = one simulation as the root, multi = caseA/caseB/caseC (caseC's
//   coefficients file fails to read) + hidden .git, nested = finished/caseA|B.
window.__openViewer = (url) => {
  opened.push(frame(url.replace("./image-viewer.html", "/__viewer_test.html").replace("./3d-viewer.html", "/__3d_test.html")));
};

async function openApp(scenario) {
  window.__pickPath = scenario;
  const app = frame("/__app_test.html");
  await waitFor(() => app.contentDocument?.getElementById("open-results") && app.contentDocument.readyState === "complete");
  app.contentDocument.getElementById("open-results").click();
  await waitFor(() => app.contentDocument.querySelector("#case-slots .tree-root") &&
    !/Indexing|Loading/.test(app.contentDocument.getElementById("panels").textContent), 120000);
  return app;
}

runTests(async () => {
  // ---- single simulation chosen as the root
  resetFrames();
  let app = await openApp("single"); let doc = app.contentDocument;
  check("single: coefficient row named after the root folder", rowNames(doc)[0] === "single", rowNames(doc).join(","));
  check("no Fritz cluster button without serve.py", doc.getElementById("cluster-settings")?.hidden === true);
  check("no Quit button without serve.py", doc.getElementById("quit-app")?.hidden === true);
  doc.querySelector('.tree-entry.image-folder[data-path="Cp_x-Section"]').click();
  check("single: top-level section opens the comparison viewer", await waitFor(() => opened[0]?.contentDocument?.querySelector(".compare-image-panel img")));
  let viewer = opened[0]?.contentDocument;
  check("single: viewer seeded with Cp", viewer?.querySelector(".compare-case-controls select")?.value === "Cp");
  check("single: viewer seeded with X axis", viewer?.querySelector(".compare-case-controls .active")?.textContent === "X");
  const singleOptions = [...(viewer?.querySelector(".compare-case-header select")?.options ?? [])].map((option) => option.textContent);
  check("single: case option labelled with the folder name", singleOptions.includes("single"), singleOptions.join("|"));

  // ---- several simulations, unreadable CSV, hidden folder
  resetFrames();
  app = await openApp("multi"); doc = app.contentDocument;
  check("multi: readable simulations listed", rowNames(doc).join(",") === "caseA,caseB", rowNames(doc).join(","));
  const errorNote = doc.querySelector("#panels .error")?.textContent ?? "";
  check("multi: unreadable coefficient file reported", /Could not read 1 coefficient file.*caseC/.test(errorNote), errorNote);
  check("multi: hidden .git folder not indexed", ![...doc.querySelectorAll("#case-slots .tree-entry")].some((entry) => entry.textContent.startsWith(".git")));
  doc.querySelector('.tree-entry.image-folder[data-path="caseA/Cp_x-Section"]').click();
  await waitFor(() => opened[0]?.contentDocument?.querySelector(".compare-image-panel img"));
  let win = opened[0].contentWindow; viewer = win.document;
  check("multi: viewer offers all simulations", viewer.querySelector(".compare-case-header select").options.length === 4, viewer.querySelector(".compare-case-header select").options.length);
  viewer.getElementById("add-case").click();
  await waitFor(() => viewer.querySelectorAll(".compare-image-panel").length === 2);
  const second = viewer.querySelectorAll(".compare-case-header select")[1];
  second.value = "caseB"; second.dispatchEvent(new win.Event("change"));
  await waitFor(() => viewer.querySelectorAll(".compare-image-panel img").length === 2);
  await idle(win);
  for (let press = 0; press < 15; press++) key(win, "ArrowRight");
  await idle(win);
  const afterBurst = captionIndex(viewer, 1);
  check("multi: burst of arrow keys steps without error", afterBurst >= 2, afterBurst);
  let previous = afterBurst, monotonic = true;
  for (let press = 0; press < 40; press++) {
    key(win, "ArrowRight"); await sleep(15);
    const now = captionIndex(viewer, 1);
    if (Number.isFinite(now)) { if (now < previous) monotonic = false; previous = now; }
  }
  await idle(win);
  const held = captionIndex(viewer, 1);
  check("multi: held arrow key never steps backwards", monotonic && held > afterBurst, `${afterBurst} -> ${held}`);
  // Speed over memory: the whole sequence loads in the background and stays loaded.
  await waitFor(() => win.eval("compareCases.every((c) => c.images.every((f) => f.image || f.failed))"), 15000);
  const loaded = win.eval("compareCases.map((c) => `${c.images.filter((f) => f.image).length}/${c.images.length}`)");
  check("multi: every frame of the shown sequences is loaded and kept", win.eval("compareCases.every((c) => c.images.every((f) => f.image))"), loaded.join(" "));
  const beforeBack = win.eval("compareCases[1].images[compareCases[1].frameIndex - 1].image");
  key(win, "ArrowLeft"); await idle(win);
  check("multi: stepping back reuses the decoded frame", viewer.querySelectorAll(".compare-image-panel")[1].querySelector("img") === beforeBack);
  const cpFrames = win.eval("compareCases[1].images");
  key(win, "y"); await idle(win);
  const axisNow = viewer.querySelectorAll(".compare-case-controls")[1].querySelector(".active")?.textContent;
  check("multi: Y key switches the focused panel's axis", axisNow === "Y" && captionIndex(viewer, 1) === 1, axisNow);
  key(win, "x"); await idle(win);
  check("multi: switching back to a section reuses its loaded frames", win.eval("compareCases[1].images") === cpFrames &&
    cpFrames.every((frame) => frame.image), `${cpFrames.filter((frame) => frame.image).length}/${cpFrames.length}`);
  key(win, "t"); await idle(win);
  check("multi: T key switches the focused panel to CpT", viewer.querySelectorAll(".compare-case-controls select")[1].value === "CpT");
  win.eval("window.__removed = compareCases[1]");
  viewer.querySelectorAll(".compare-image-panel")[1].querySelector(".remove-case").click();
  await idle(win);
  check("multi: removed case releases its images", viewer.querySelectorAll(".compare-image-panel").length === 1 &&
    win.eval("[...__removed.sectionFrames.values()].flat().filter((f) => f.image || f.url).length") === 0 && !win.eval("preloadSequences.has(__removed)"));
  check("multi: viewer shows no error", viewer.getElementById("viewer-error").hidden, viewer.getElementById("viewer-error").textContent);

  // pressure overlay with a case missing the primary station (caseB has no 2460 mm)
  doc.querySelector('summary.tree-entry[data-path="caseA/PressureDistributions/pd_FW_x-Section"]').click();
  await waitFor(() => doc.querySelector("svg.pressure-chart"));
  const xLabel = doc.querySelector(".pressure-axis-label")?.textContent;
  check("pressure: x-axis label present", xLabel && xLabel.includes("mm"), xLabel);
  const chartTitle = doc.querySelector("svg.pressure-chart title")?.textContent ?? "";
  check("pressure: chart title has no 'undefined'", chartTitle && !chartTitle.includes("undefined"), chartTitle);
  doc.querySelector(".pressure-toolbar select").value = "caseB";
  doc.querySelector(".pressure-toolbar button").click();
  await waitFor(() => doc.querySelectorAll("svg.pressure-chart .pressure-legend-label").length === 3);
  const legend = [...doc.querySelectorAll("svg.pressure-chart .pressure-legend-label")].map((label) => label.textContent);
  check("pressure: off-station case labelled in legend", legend.includes("caseB @ 2440 mm") && legend.includes("caseA"),
    `${doc.querySelector(".pressure-chart-title")?.textContent} | ${legend.join(" | ")} | ${doc.getElementById("panels").textContent.slice(0, 300)}`);
  const details = doc.querySelector(".pressure-chart-details")?.textContent ?? "";
  check("pressure: details note the nearest-station substitution", /no data at 2460 mm.*nearest station/.test(details), details);

  // 3D scene gallery zoom
  doc.querySelector(".scene-gallery-folder").click();
  await waitFor(() => opened[1]?.contentDocument?.querySelector("#image-stage img")?.naturalWidth);
  win = opened[1].contentWindow; viewer = win.document;
  const stage = viewer.getElementById("image-stage");
  for (let press = 0; press < 3; press++) viewer.getElementById("zoom-in").click();
  await sleep(150);
  stage.scrollLeft = 0; stage.scrollTop = 0;
  const image = stage.querySelector("img");
  const stageBox = stage.getBoundingClientRect(), imageBox = image.getBoundingClientRect();
  check("gallery: zoom makes the image scrollable", stage.scrollWidth > stage.clientWidth + 10, `${stage.scrollWidth} vs ${stage.clientWidth}`);
  check("gallery: zoomed top-left corner reachable", imageBox.left >= stageBox.left - 1 && imageBox.top >= stageBox.top - 1, `${imageBox.left},${imageBox.top} vs ${stageBox.left},${stageBox.top}`);
  stage.scrollLeft = stage.scrollWidth;
  check("gallery: zoomed right edge reachable", Math.abs(image.getBoundingClientRect().right - (stage.getBoundingClientRect().left + stage.clientWidth)) < 3);
  const galleryBox = stage.querySelector(".compare-zoom-frame");
  stage.scrollLeft = 30; stage.scrollTop = 20;
  key(win, "ArrowRight");
  check("gallery: the current image stays until the next one is decoded", stage.querySelector("img") === image);
  await waitFor(() => stage.querySelector("img") !== image, 5000);
  check("gallery: stepping swaps in place, sized, position kept", stage.querySelector(".compare-zoom-frame") === galleryBox &&
    stage.querySelector("img").style.width !== "" && stage.scrollLeft === 30 && stage.scrollTop === 20,
    `${stage.scrollLeft},${stage.scrollTop} ${stage.querySelector("img").style.width}`);
  await waitFor(() => win.eval("images.every((f) => f.image || f.failed)"), 10000);
  check("gallery: all scenes load in the background", win.eval("images.length > 1 && images.every((f) => f.image)"), win.eval("images.map((f) => !!f.image).join()"));

  // ---- nested simulations
  resetFrames();
  app = await openApp("nested"); doc = app.contentDocument;
  check("nested: both nested simulations in the table", rowNames(doc).join(",") === "caseA,caseB", rowNames(doc).join(","));
  doc.querySelector('.tree-entry.image-folder[data-path="finished/caseA/Cp_x-Section"]').click();
  await waitFor(() => opened[0]?.contentDocument?.querySelector(".compare-image-panel img"));
  const nestedOptions = [...opened[0].contentDocument.querySelector(".compare-case-header select").options].map((option) => option.textContent);
  check("nested: viewer can add the other nested simulation", nestedOptions.length === 3, nestedOptions.join("|"));
  doc.querySelector('summary.tree-entry[data-path="finished/caseA/PressureDistributions/pd_FW_x-Section"]').click();
  await waitFor(() => doc.querySelector("svg.pressure-chart"));
  check("nested: pressure workspace offers the other simulation", [...doc.querySelector(".pressure-toolbar select").options].some((option) => option.value === "finished/caseB"));

  // ---- remembered folder needing permission + viewer entry pruning
  resetFrames();
  __mockStore.set("resultsRoot", new MockDir("multi", "prompt"));
  __mockStore.set("viewer-set:old", []);
  __mockStore.set("viewer-set:new", []);
  __mockStore.set("viewer-time:new", Date.now());
  app = frame("/__app_test.html");
  const reconnect = await waitFor(() => { const button = app.contentDocument?.getElementById("reconnect-results"); return button && !button.hidden && button; });
  check("reconnect: one-click reconnect offered", reconnect, reconnect?.textContent);
  check("prune: stale viewer entries removed, recent kept", !__mockStore.has("viewer-set:old") && __mockStore.has("viewer-set:new"), [...__mockStore.keys()].join(","));
  reconnect?.click();
  await waitFor(() => app.contentDocument.querySelector(".data-table tbody tr"));
  check("reconnect: folder loads after reconnect", rowNames(app.contentDocument).length === 2 && app.contentDocument.getElementById("reconnect-results").hidden);

  // ---- 3D viewer with the browser picker
  resetFrames();
  window.__pickPath = "multi/caseA/3D-data";
  const viewer3dFrame = frame("/__3d_test.html");
  await waitFor(() => viewer3dFrame.contentDocument?.getElementById("open-folder") && viewer3dFrame.contentDocument.readyState === "complete");
  const win3d = viewer3dFrame.contentWindow, doc3d = viewer3dFrame.contentDocument;
  doc3d.getElementById("open-folder").click();
  await waitFor(() => !doc3d.getElementById("legend").hidden || !doc3d.getElementById("error").hidden, 60000);
  check("3d: EnSight case loads", !doc3d.getElementById("legend").hidden && win3d.eval("model.ix.length / 3") === 5,
    doc3d.getElementById("error").hidden ? String(win3d.eval("model?.ix.length")) : doc3d.getElementById("error").textContent);
  const field = doc3d.getElementById("field-select");
  field.value = "PressureCoefficient"; field.dispatchEvent(new win3d.Event("change"));
  field.value = "CpX"; field.dispatchEvent(new win3d.Event("change"));
  await sleep(2000);
  check("3d: rapid field switch ends on the selected field", doc3d.getElementById("legend-title").textContent === "CpX", doc3d.getElementById("legend-title").textContent);
  doc3d.getElementById("auto-range").click();
  check("3d: auto range legend uses up to 3 decimals", doc3d.getElementById("legend-min").textContent === "-2.25" && doc3d.getElementById("legend-max").textContent === "1.125",
    `${doc3d.getElementById("legend-min").textContent} … ${doc3d.getElementById("legend-max").textContent}`);
  doc3d.getElementById("cp-min").value = "2"; doc3d.getElementById("cp-max").value = "-1";
  doc3d.getElementById("cp-min").dispatchEvent(new win3d.Event("input"));
  check("3d: reversed range swapped and flagged", doc3d.getElementById("legend-min").textContent === "-1" && doc3d.getElementById("legend-max").textContent === "2" && doc3d.getElementById("cp-min").matches(":invalid"),
    `${doc3d.getElementById("legend-min").textContent} … ${doc3d.getElementById("legend-max").textContent}`);
  const nanMesh = win3d.eval("(() => { const parts=[{id:1,name:'t',points:new Float32Array([0,0,0, 1,0,0, 0,1,0, 1,1,0]),blocks:[{type:'tria3',count:2,width:3,conn:new Uint32Array([0,1,2, 1,3,2]),cp:new Float32Array([1,NaN])}]}]; const m=toMesh(parts); return [...m.cp].map(String).join(','); })()");
  check("3d: NaN cells don't poison shared points", nanMesh === "1,1,1,NaN", nanMesh);
  // STAR-CCM+ leaves small split-off wall pieces out of the field files; those cells get no value (grey).
  const omitted = win3d.eval(`(() => {
    const text = (s) => { const b = new Uint8Array(80); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
    const chunks = [text("Cp"), text("part"), new Int32Array([1]), text("tria3"), new Float32Array([0.5])];
    const bytes = new Uint8Array(chunks.reduce((n, c) => n + c.byteLength, 0)); let at = 0;
    for (const c of chunks) { bytes.set(new Uint8Array(c.buffer, c.byteOffset, c.byteLength), at); at += c.byteLength; }
    const tri = () => ({ type: "tria3", count: 1, width: 3, conn: new Uint32Array([0, 1, 2]) });
    const parts = [{ id: 1, name: "Frontwing", points: new Float32Array([0,0,0, 1,0,0, 0,1,0]), blocks: [tri()] },
                   { id: 2, name: "Frontwing 2", points: new Float32Array([0,0,1, 1,0,1, 0,1,1]), blocks: [tri()] }];
    readCp(bytes.buffer, parts); const m = toMesh(parts);
    return [...m.cp].map(String).join(",") + " | " + m.min + ".." + m.max; })()`);
  check("3d: parts left out of a field file load without values", omitted === "0.5,0.5,0.5,NaN,NaN,NaN | 0.5..0.5", omitted);

  // Camera: turntable around +Z, true (unmirrored) views, presets, axes widget, keys, shading, zoom at the pointer.
  const near = (a, b) => Math.abs(a - b) < 1e-6;
  const mirrored = win3d.eval(`(() => { for (const [az, el] of [[0, 0], [.7, .3], [2, -1.2], [-2.5, Math.PI / 2]]) {
    const {right: r, up: u, back: b} = viewBasis(az, el);
    const det = r[0] * (u[1] * b[2] - u[2] * b[1]) - r[1] * (u[0] * b[2] - u[2] * b[0]) + r[2] * (u[0] * b[1] - u[1] * b[0]);
    if (Math.abs(det - 1) > 1e-9) return "det " + det; } return "ok"; })()`);
  check("3d: every view is a rotation, never a mirror image", mirrored === "ok", mirrored);
  const front = win3d.eval("viewBasis(0, 0)"), top = win3d.eval("viewBasis(Math.PI, Math.PI / 2)");
  check("3d: front view has the car's left (+Y) on the right and Z up",
    near(front.right[1], 1) && near(front.up[2], 1) && near(front.back[0], 1), JSON.stringify(front));
  check("3d: top view has the nose (+X) pointing up", near(top.up[0], 1) && near(top.back[2], 1), JSON.stringify(top));
  const preset = doc3d.getElementById("view-preset");
  const camera = () => win3d.eval("({az: azimuth, el: elevation, zoom, panX, panY})");
  preset.value = "top"; preset.dispatchEvent(new win3d.Event("change"));
  await new Promise((resolve) => setTimeout(resolve, 600));
  let view = camera();
  check("3d: Top preset looks straight down", near(view.el, Math.PI / 2) && near(Math.cos(view.az), -1), JSON.stringify(view));
  const scene = doc3d.getElementById("scene"), box = scene.getBoundingClientRect();
  const pointer = (type, x, y, extra = {}) => scene.dispatchEvent(new win3d.PointerEvent(type, { clientX: box.left + x, clientY: box.top + y, bubbles: true, pointerId: 1, ...extra }));
  pointer("pointerdown", 100, 100); pointer("pointermove", 160, 100); pointer("pointerup", 160, 100);
  const turned = camera();
  check("3d: horizontal drag turns around the vertical axis only", near(turned.el, Math.PI / 2) && near(turned.az, view.az - 60 * .008) && preset.value === "custom",
    `${JSON.stringify(turned)} ${preset.value}`);
  pointer("pointerdown", 100, 100); pointer("pointermove", 100, -900); pointer("pointerup", 100, -900);
  check("3d: vertical drag tilts but stops at straight below (car never flips)", near(camera().el, -Math.PI / 2), JSON.stringify(camera()));
  pointer("pointerdown", 100, 100, { button: 2 }); pointer("pointermove", 140, 100, { button: 2 }); pointer("pointerup", 140, 100, { button: 2 });
  check("3d: right drag moves instead of turning", near(camera().el, -Math.PI / 2) && camera().panX > turned.panX, JSON.stringify(camera()));
  const axes = doc3d.getElementById("axes");
  check("3d: axes widget is shown with the model", !axes.hidden && axes.clientWidth > 50);
  const plusX = win3d.eval("axisHandles().find((h) => h.axis.label === 'X' && h.sign > 0)");
  const axesBox = axes.getBoundingClientRect();
  axes.dispatchEvent(new win3d.MouseEvent("click", { clientX: axesBox.left + plusX.x, clientY: axesBox.top + plusX.y, bubbles: true }));
  await new Promise((resolve) => setTimeout(resolve, 600));
  view = camera();
  check("3d: clicking the X axis looks at the front", preset.value === "front" && near(view.el, 0) && near(Math.cos(view.az), 1), `${preset.value} ${JSON.stringify(view)}`);
  scene.dispatchEvent(new win3d.KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
  await new Promise((resolve) => setTimeout(resolve, 600));
  check("3d: arrow key turns 15°", near(camera().az, view.az + Math.PI / 12) && preset.value === "custom", JSON.stringify(camera()));
  scene.dispatchEvent(new win3d.KeyboardEvent("keydown", { key: "Home", bubbles: true }));
  await new Promise((resolve) => setTimeout(resolve, 600));
  check("3d: Home returns to the front-left view", preset.value === "front-left" && near(Math.cos(camera().az), Math.SQRT1_2) && near(Math.sin(camera().az), Math.SQRT1_2),
    `${preset.value} ${JSON.stringify(camera())}`);
  const shadingBox = doc3d.getElementById("shading");
  shadingBox.checked = false; shadingBox.dispatchEvent(new win3d.Event("change"));
  check("3d: shading can be switched off", win3d.eval("shading") === false);
  // The model point under the pointer stays under it: (pointer - pan) / zoom is unchanged.
  // Wheel events carry whole-pixel coordinates.
  const before = camera(), client = { x: Math.round(box.left + box.width * .8), y: Math.round(box.top + box.height * .3) };
  const ndc = { x: 2 * (client.x - box.left) / box.width - 1, y: 1 - 2 * (client.y - box.top) / box.height };
  scene.dispatchEvent(new win3d.WheelEvent("wheel", { clientX: client.x, clientY: client.y, deltaY: -200, bubbles: true, cancelable: true }));
  const after = camera();
  check("3d: wheel zooms towards the pointer", after.zoom > before.zoom &&
    near((ndc.x - after.panX) / after.zoom, (ndc.x - before.panX) / before.zoom) && near((ndc.y - after.panY) / after.zoom, (ndc.y - before.panY) / before.zoom),
    `${JSON.stringify(before)} → ${JSON.stringify(after)}`);

  // Flow parts: the Lambda2 iso-surface has its own checkbox; a part switched off is not drawn.
  const vortexBox = doc3d.querySelector('#part-toggles input[data-kind="vortices"]');
  check("3d: Lambda2 part gets a Vortices checkbox, off at first", !doc3d.getElementById("part-toggles").hidden && vortexBox?.checked === false &&
    win3d.eval("hiddenParts.has('Lambda2')") === true && /Vortices/.test(vortexBox?.parentElement?.textContent ?? ""), doc3d.getElementById("part-toggles").textContent);
  vortexBox.checked = true; vortexBox.dispatchEvent(new win3d.Event("change"));
  check("3d: ticking Vortices shows the Lambda2 part", win3d.eval("hiddenParts.has('Lambda2')") === false);
  vortexBox.checked = false; vortexBox.dispatchEvent(new win3d.Event("change"));
  check("3d: unticking Vortices hides the Lambda2 part", win3d.eval("hiddenParts.has('Lambda2')") === true);
  vortexBox.checked = true; vortexBox.dispatchEvent(new win3d.Event("change"));
  // Colour range per field: a non-Cp field starts from its own values; ranges set by hand are remembered per field.
  const fieldSelect = doc3d.getElementById("field-select"), rangeOf = () => [doc3d.getElementById("cp-min").value, doc3d.getElementById("cp-max").value].join("..");
  const showField = async (name) => { fieldSelect.value = name; fieldSelect.dispatchEvent(new win3d.Event("change"));
    await waitFor(() => doc3d.getElementById("legend-title").textContent === name, 10000); };
  check("3d: field names with spaces are read from the .case file", [...fieldSelect.options].some((o) => o.value === "Velocity Magnitude"),
    [...fieldSelect.options].map((o) => o.value).join(","));
  const meshBefore = win3d.eval("model.ix");
  await showField("Velocity Magnitude");
  check("3d: another field keeps the mesh, with the same values as a full rebuild", win3d.eval("model.ix") === meshBefore && win3d.eval("model.lineIx.length") > 0
    && win3d.eval("(() => { const full = toMesh(geometryParts); return full.cp.length === model.cp.length && full.cp.every((v, i) => Object.is(v, model.cp[i])) && full.min === model.min && full.max === model.max; })()"),
    String(win3d.eval("model.lineIx.length")));
  const [vMin, vMax] = rangeOf().split("..").map(Number);
  check("3d: a non-Cp field starts with a range from its own values", vMin >= 10 && vMax <= 30 && vMin < vMax, rangeOf());
  doc3d.getElementById("cp-min").value = "0"; doc3d.getElementById("cp-max").value = "50";
  doc3d.getElementById("cp-max").dispatchEvent(new win3d.Event("input"));
  await showField("PressureCoefficient");
  check("3d: a Cp field starts at -5..1", rangeOf() === "-5..1", rangeOf());
  await showField("Velocity Magnitude");
  check("3d: the range set for a field comes back with it", rangeOf() === "0..50", rangeOf());
  // export3D.java writes the car, the flow parts and the streamlines as three cases in one folder; they show as one model.
  check("3d: car, flow and streamline cases of one folder load as one model", win3d.eval("caseSets.length") === 3 &&
    win3d.eval("caseSets.map((set) => set.parts.map((p) => p.name).join('+')).join(' | ')") === "Frontwing+wheel-fr | Lambda2 | Streamlines 1+Streamlines 2",
    win3d.eval("caseSets.map((set) => set.parts.map((p) => p.name).join('+')).join(' | ')"));
  await showField("CpX");
  check("3d: a field only the car case has leaves the flow parts and streamlines without values",
    win3d.eval("[...model.cp].filter(Number.isNaN).length") === 29 && win3d.eval("[...model.cp].filter(Number.isFinite).length") > 0,
    win3d.eval("[...model.cp].map(String).join(',')"));

  // Streamlines: lines (bar2) cut off 1 m behind the car's tail (Frontwing starts at x = 0); one checkbox for all rows.
  const lineInfo = () => win3d.eval("model.lineRanges.map((r) => `${r.name}:${r.count / 2}`).join(',')");
  check("3d: streamlines are drawn as lines, cut off 1 m behind the car", lineInfo() === "Frontwing:0,wheel-fr:0,Lambda2:0,Streamlines 1:12,Streamlines 2:4" &&
    win3d.eval("Math.min(...[...model.lineIx].map((n) => model.pos[3 * n]))") >= -1, lineInfo());
  await showField("Velocity Magnitude");
  check("3d: streamlines are coloured by the selected field", win3d.eval("[...model.lineIx].every((n) => model.cp[n] === 22)"), win3d.eval("[...model.lineIx].map((n) => model.cp[n]).join(',')"));
  check("3d: the view is fitted to the surfaces, not the streamlines", win3d.eval("model.lo[0]") === 0 && win3d.eval("model.hi[0]") === 2,
    win3d.eval("JSON.stringify([model.lo, model.hi])"));
  const streamBoxes = doc3d.querySelectorAll('#part-toggles input[data-kind="streamlines"]');
  check("3d: one Streamlines checkbox for all rows, off at first", streamBoxes.length === 1 && !streamBoxes[0].checked &&
    win3d.eval("hiddenParts.has('Streamlines 1') && hiddenParts.has('Streamlines 2')"), doc3d.getElementById("part-toggles").textContent);
  streamBoxes[0].checked = true; streamBoxes[0].dispatchEvent(new win3d.Event("change"));
  check("3d: ticking Streamlines shows every row", win3d.eval("!hiddenParts.has('Streamlines 1') && !hiddenParts.has('Streamlines 2')"));
  streamBoxes[0].checked = false; streamBoxes[0].dispatchEvent(new win3d.Event("change"));
  check("3d: unticking Streamlines hides every row", win3d.eval("hiddenParts.has('Streamlines 1') && hiddenParts.has('Streamlines 2') && !hiddenParts.has('Lambda2')"));
  streamBoxes[0].checked = true; streamBoxes[0].dispatchEvent(new win3d.Event("change"));

  // Choosing streamlines: pieces joined into 8 lines (2 rows × 4) by their start points; every Nth row and column,
  // height and width ranges of the start points; remembered.
  const shown = () => [doc3d.getElementById("stream-count").textContent,
    win3d.eval("renderer.lineRanges.filter((r) => /Streamlines/.test(r.name)).map((r) => r.count / 2).join('+')")].join(" / ");
  const setStream = (id, value) => { const input = doc3d.getElementById(id); input.value = value;
    input.dispatchEvent(new win3d.Event(id === "stream-every" ? "change" : "input")); };
  const bar = doc3d.getElementById("streamline-control");
  check("3d: streamline bar shows the start range and every 2nd line at first", !bar.hidden && shown() === "2 of 8 lines / 6+0" &&
    ["stream-z-min", "stream-z-max", "stream-y-min", "stream-y-max"].map((id) => doc3d.getElementById(id).placeholder).join(",") === "0.3,0.6,0,0.75",
    `${shown()} | ${["stream-z-min", "stream-z-max", "stream-y-min", "stream-y-max"].map((id) => doc3d.getElementById(id).placeholder)}`);
  check("3d: streamline start points: rows by height, columns across the width",
    win3d.eval("streamlineGrid.map((l) => `${l.row}${l.col}`).sort().join(',')") === "00,01,02,03,10,11,12,13", win3d.eval("JSON.stringify(streamlineGrid)"));
  setStream("stream-every", "1");
  check("3d: All lines shows every segment, including joined pieces", shown() === "8 of 8 lines / 12+4", shown());
  setStream("stream-z-min", "0.5");
  check("3d: a height range keeps the lines starting inside it", shown() === "4 of 8 lines / 0+4", shown());
  setStream("stream-z-min", ""); setStream("stream-y-min", "0.7"); setStream("stream-y-max", "0.8");
  check("3d: a width range keeps those lines; a piece after a gap stays with its line", shown() === "2 of 8 lines / 3+1", shown());
  check("3d: the streamline choice is remembered", JSON.parse(win3d.localStorage.getItem("homo-cfd-3d-streamlines-v1") || "{}").y0 === "0.7",
    win3d.localStorage.getItem("homo-cfd-3d-streamlines-v1"));
  const widthSelect = doc3d.getElementById("stream-width");
  check("3d: streamlines are 2 px wide at first", widthSelect.value === "2" && win3d.eval("lineWidth") === 2, widthSelect.value);
  widthSelect.value = "6"; widthSelect.dispatchEvent(new win3d.Event("change"));
  const thick = win3d.eval("(() => { draw(); const e = gl.getError(); return lineWidth + ' ' + e + ' ' + localStorage.getItem('homo-cfd-3d-line-width-v1'); })()");
  check("3d: a thicker setting draws without errors and is remembered", thick === "6 0 6", thick);
  widthSelect.value = "2"; widthSelect.dispatchEvent(new win3d.Event("change"));

  // Palettes: the field colours and the legend bar follow the chosen palette; remembered.
  const paletteSelect = doc3d.getElementById("palette");
  check("3d: 7 HoMo palettes and 4 STAR-CCM+ colormaps, Rainbow at first", paletteSelect.options.length === 11 &&
    [...paletteSelect.querySelectorAll("optgroup")].map((g) => g.children.length).join("+") === "7+4" && paletteSelect.value === "rainbow",
    [...paletteSelect.options].map((o) => o.textContent).join(", "));
  paletteSelect.value = "viridis"; paletteSelect.dispatchEvent(new win3d.Event("change"));
  const palette = win3d.eval("(() => { draw(); return gl.getError() + ' ' + paletteTable().length + ' ' + localStorage.getItem('homo-cfd-3d-palette-v1'); })()");
  const legendBar = doc3d.querySelector("#legend div").style.background;
  check("3d: Viridis colours the field and the legend, and is remembered", palette === "0 1024 viridis" && /rgb\(68, 1, 84\)/.test(legendBar), `${palette} | ${legendBar}`);
  // FAU-bwr (from maps.colormap): uneven colour points, white in the middle; Rainbow keeps its original colours.
  const fau = win3d.eval("(() => { const t = paletteTable('faubwr'); const r = paletteTable('rainbow'); return [t[0], t[1], t[2], t[4 * 128], t[4 * 128 + 1], t[4 * 255], t[4 * 255 + 1], r[0], r[1], r[2]].join(','); })()");
  check("3d: STAR-CCM+ colormap blended at its own colour points", fau === "4,49,106,255,254,255,0,82,51,219", fau);
  paletteSelect.value = "rainbow"; paletteSelect.dispatchEvent(new win3d.Event("change"));

  // Value under the mouse, seen from the top (nose up). Canvas position of a model point, in CSS pixels.
  await showField("PressureCoefficient");
  preset.value = "top"; preset.dispatchEvent(new win3d.Event("change"));
  await new Promise((resolve) => setTimeout(resolve, 600));
  const toCanvas = (x, y, z) => win3d.eval(`(() => { const v = viewBasis(), a = [${x}, ${y}, ${z}].map((c, i) => (c - model.center[i]) / model.radius);
    const dot = (b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], w = canvas.clientWidth, h = canvas.clientHeight;
    const nx = dot(v.right) * zoom * canvas.height / canvas.width + panX, ny = dot(v.up) * zoom + panY;
    return [(nx + 1) / 2 * w, (1 - ny) / 2 * h]; })()`);
  const probe = (x, y, z) => { const [cx, cy] = toCanvas(x, y, z); return win3d.eval(`JSON.stringify(probeAt(${cx}, ${cy}))`); };
  const onWing = JSON.parse(probe(1.5, 0.4, 0) ?? "null");
  check("3d: the value under the mouse on the car: part, position and the interpolated field value",
    onWing?.part === "Frontwing" && Math.abs(onWing.x - 1.5) < 0.03 && Math.abs(onWing.y - 0.4) < 0.03 && Math.abs(onWing.z) < 1e-6 && Math.abs(onWing.value - 0.2917) < 0.03, JSON.stringify(onWing));
  // (The streamline filter is still on width 0.7–0.8 m here: the lines at y = 0.75, the upper row at z = 0.6.)
  const onLine = JSON.parse(probe(1.5, 0.75, 0.6) ?? "null");
  check("3d: on a streamline it reads the streamline", onLine?.part === "Streamlines" && Math.abs(onLine.value + 0.5) < 1e-6 && Math.abs(onLine.z - 0.6) < 1e-6, JSON.stringify(onLine));
  check("3d: nothing under the mouse, no value", probe(5, 5, 0) === "null", probe(5, 5, 0));
  const [hx, hy] = toCanvas(1.5, 0.4, 0), canvasBox = scene.getBoundingClientRect();
  scene.dispatchEvent(new win3d.PointerEvent("pointermove", { clientX: canvasBox.left + hx, clientY: canvasBox.top + hy, bubbles: true, pointerId: 1 }));
  await waitFor(() => !doc3d.getElementById("probe").hidden, 3000);
  check("3d: moving the mouse shows the readout", /PressureCoefficient 0\.2[89]\d*/.test(doc3d.getElementById("probe").textContent) && /Frontwing/.test(doc3d.getElementById("probe").textContent),
    doc3d.getElementById("probe").textContent);
  scene.dispatchEvent(new win3d.PointerEvent("pointerleave", { bubbles: true, pointerId: 1 }));
  check("3d: no coefficient box for a folder picked in the browser (its simulation is unknown)", doc3d.getElementById("coefficients").hidden);

  // A narrow window (laptop with display scaling): the toolbar wraps instead of pushing buttons off screen.
  const frameWidth = viewer3dFrame.style.width;
  viewer3dFrame.style.width = "1000px";
  await new Promise((resolve) => setTimeout(resolve, 200));
  const offScreen = [...doc3d.querySelectorAll(".cfd3d-toolbar button, .cfd3d-toolbar .range-control")]
    .filter((control) => !control.hidden && control.offsetParent && control.getBoundingClientRect().right > doc3d.documentElement.clientWidth + 1)
    .map((control) => control.id || control.textContent.trim().slice(0, 20));
  const openButton = doc3d.getElementById("open-folder").getBoundingClientRect();
  check("3d: in a narrow window every toolbar control stays on screen", offScreen.length === 0 && openButton.height < 40,
    `off screen: ${offScreen.join(", ") || "none"}; Open folder button ${Math.round(openButton.height)} px high`);
  viewer3dFrame.style.width = frameWidth;
  doc3d.getElementById("stream-all").click();
  check("3d: All positions clears the ranges", shown() === "8 of 8 lines / 12+4" && doc3d.getElementById("stream-y-min").value === "" && doc3d.getElementById("stream-every").value === "1", shown());

  // Surface flow: the wall shear stress components are not fields to pick; a checkbox (off at first) draws them as short lines.
  check("3d: wall shear stress components are not in the Field list", ![...fieldSelect.options].some((o) => /WallShearStress[XYZ]/.test(o.value)),
    [...fieldSelect.options].map((o) => o.value).join(","));
  const flowBox = doc3d.querySelector('#part-toggles input[data-kind="surface-flow"]');
  check("3d: Surface flow checkbox, off by default", flowBox && !flowBox.checked && win3d.eval("surfaceFlow") === null, doc3d.getElementById("part-toggles").textContent);
  flowBox.checked = true; flowBox.dispatchEvent(new win3d.Event("change"));
  await waitFor(() => win3d.eval("surfaceFlow !== null") || !doc3d.getElementById("error").hidden, 10000);
  check("3d: ticking Surface flow draws one line per surface cell here", win3d.eval("surfaceFlow?.count") === 6 && win3d.eval("surfaceFlowOn") === true,
    doc3d.getElementById("error").hidden ? String(win3d.eval("surfaceFlow?.count")) : doc3d.getElementById("error").textContent);
  // Each line runs along the surface (the part of the shear off the surface removed) from light to dark in the flow direction.
  const streaks = win3d.eval("(() => { const s = surfaceStreaks(geometryParts, model.radius / 150); const out = [];" +
    " for (let i = 0; i < s.alpha.length; i += 2) out.push([s.pos[3 * i + 3] - s.pos[3 * i], s.pos[3 * i + 4] - s.pos[3 * i + 1], s.pos[3 * i + 5] - s.pos[3 * i + 2], s.alpha[i] < s.alpha[i + 1]]);" +
    " return JSON.stringify(out); })()");
  const directions = JSON.parse(streaks);
  check("3d: surface flow lines follow the wall shear stress along the surface, reversed flow points back",
    directions.length === 3 && directions.every(([, dy, dz, fades]) => dy === 0 && Math.abs(dz) < 1e-9 && fades) &&
    directions.filter(([dx]) => dx > 0).length === 2 && directions.filter(([dx]) => dx < 0).length === 1, streaks);
  flowBox.checked = false; flowBox.dispatchEvent(new win3d.Event("change"));

  check("3d: unticking Surface flow hides the lines", win3d.eval("surfaceFlowOn") === false);
});
</script></body></html>
