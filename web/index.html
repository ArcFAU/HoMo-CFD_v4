<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HoMo CFD</title>
    <link rel="icon" href="./homo-cfd.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <!-- The title is also the working-directory button; the line below it shows the folder. -->
        <button class="brand brand-button" id="open-results" type="button" title="Choose the folder that holds your results">
          <img src="./High-Voltage_white.png" alt="High Voltage Motorsports" />
          <span class="brand-text">
            <span class="brand-title">HoMo CFD</span>
            <span class="brand-path" id="working-dir-label">Open folder</span>
          </span>
        </button>
        <div class="error" id="error" hidden></div>
        <button class="primary small" id="reconnect-results" type="button" hidden>Reconnect folder</button>
        <div class="group">
          <div class="filesystem-heading">
            <h2>Results</h2>
          </div>
          <input id="folder-search" class="folder-search" type="search" placeholder="Filter folders" aria-label="Filter folders" />
          <div id="case-slots"></div>
        </div>
        <div class="sidebar-footer">
          <button class="small-control" id="open-3d-viewer" type="button" title="Open the 3D viewer and choose a simulation with 3D data there">3D viewer</button>
          <button class="small-control" id="cluster-settings" type="button" title="Fritz cluster: connection, simulations, new simulations" hidden>Cluster</button>
          <button class="small-control quit-button" id="quit-app" type="button" title="Quit HoMo CFD (it runs in the background without a window)" aria-label="Quit HoMo CFD" hidden>⏻</button>
        </div>
      </aside>
      <main class="viewer">
        <div class="summary" id="summary" hidden></div>
        <div class="panels" id="panels"></div>
      </main>
    </div>
    <dialog id="column-dialog" class="column-dialog" aria-labelledby="column-dialog-title">
      <form method="dialog" class="column-dialog-content">
        <header class="column-dialog-header">
          <div>
            <h2 id="column-dialog-title">Customize columns</h2>
          </div>
          <button id="column-cancel" class="small-control" type="button" aria-label="Close column settings">×</button>
        </header>
        <div id="column-editor" class="column-editor"></div>
        <footer class="column-dialog-actions">
          <button id="column-reset" class="small-control" type="button">Reset defaults</button>
          <button id="column-save" class="primary small" type="button">Apply columns</button>
        </footer>
      </form>
    </dialog>
    <script src="./server-fs.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
