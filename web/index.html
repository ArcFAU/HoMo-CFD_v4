<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HoMo CFD</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span><img src="./High-Voltage_white.png" alt="High Voltage Motorsports" /> </span>
          <span>HoMo CFD</span>
        </div>
        <div class="error" id="error" hidden></div>
        <button class="primary small" id="reconnect-results" type="button" hidden>Reconnect folder</button>
        <div class="group">
          <div class="filesystem-heading">
            <h2>Results</h2>
            <button class="primary small" id="open-results" type="button">Open folder</button>
          </div>
          <button class="small-control" id="open-3d-viewer" type="button">Open 3D Cp viewer</button>
          <input id="folder-search" class="folder-search" type="search" placeholder="Filter folders" aria-label="Filter folders" />
          <div id="case-slots"></div>
        </div>
      </aside>
      <main class="viewer">
        <div class="summary" id="summary" hidden></div>
        <div class="panels" id="panels"></div>
      </main>
    </div>
    <dialog id="column-dialog" class="column-dialog" aria-labelledby="column-dialog-title">
      <form method="dialog" class="column-dialog-content">
        <header class="column-dialog-header">
          <div>
            <h2 id="column-dialog-title">Customize columns</h2>
            <p class="hint">Choose which values appear, set their display names, and arrange their order.</p>
          </div>
          <button id="column-cancel" class="small-control" type="button" aria-label="Close column settings">×</button>
        </header>
        <div id="column-editor" class="column-editor"></div>
        <footer class="column-dialog-actions">
          <button id="column-reset" class="small-control" type="button">Reset defaults</button>
          <button id="column-save" class="primary small" type="button">Apply columns</button>
        </footer>
      </form>
    </dialog>
    <script src="./server-fs.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
